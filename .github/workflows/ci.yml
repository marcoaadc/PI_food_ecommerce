name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-lint-test:
    name: Backend - Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: packages/backend/node_modules
          key: ${{ runner.os }}-backend-node-modules-${{ hashFiles('packages/backend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-backend-node-modules-

      - name: Install dependencies
        working-directory: packages/backend
        run: npm ci

      - name: Lint
        working-directory: packages/backend
        run: npm run lint

      - name: Test
        working-directory: packages/backend
        run: npm run test

  frontend-lint-build:
    name: Frontend - Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: packages/frontend/node_modules
          key: ${{ runner.os }}-frontend-node-modules-${{ hashFiles('packages/frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-frontend-node-modules-

      - name: Install dependencies
        working-directory: packages/frontend
        run: npm ci

      - name: Lint
        working-directory: packages/frontend
        run: npm run lint || true

      - name: Build
        working-directory: packages/frontend
        run: npm run build
